# FreshStack benchmark (the KARLBench sub-benchmark; procedural reasoning over recent technical docs).
#
# Each FreshStack TOPIC is a separate corpus, so each topic has its own Chroma collection. `topic` is
# the single knob — it derives the data paths + collection name (override nothing else to switch sets):
#   - test = `langchain` (KARL's FreshStack): 203 questions / 49,514 docs  -> freshstack-langchain-qwen-0.6b
#   - dev  = `laravel`   (closest-sized set): 184 questions / 52,351 docs  -> freshstack-laravel-qwen-0.6b
# Each topic's collection is named from the topic (freshstack-{topic}-qwen-0.6b); the chroma server
# must host the collection for whichever topic you run.
# Both are embedded with Qwen3-Embedding-0.6B (1024-dim); KARL retrieves FreshStack with Qwen3-0.6B at
# k=10 (for the rag_llm system set `systems.top_k=10`; the search_agent controls its own retrieval
# breadth per tool call). Scoring = nugget-completion recall.
#
# Build a topic's index offline (run once per topic; <bench> = qatfd/benchmarks):
#   1. download the topic's corpus + queries from HuggingFace to <bench>/freshstack/{topic}/ :
#        python engaging-scripts/download_freshstack.py --topics langchain laravel --out_dir <bench>/freshstack
#      (corpus.jsonl = {_id, text, metadata}; queries.jsonl = {query_id, query_title, query_text, nuggets[]})
#   2. embed the topic's corpus (GPU):  sbatch engaging-scripts/run_freshstack_embeddings.slurm langchain
#   3. build the Chroma collection:
#        python3 engaging-scripts/create_vector_db.py \
#          --embeddings-dir <bench>/freshstack/langchain/embeddings \
#          --collection-name freshstack-langchain-qwen-0.6b \
#          --chroma-path <bench>/freshstack/langchain/chromadb --benchmark freshstack
#
# Runs MUST embed the query with the SAME 0.6B model. OpenRouter does NOT serve the 0.6B model, so
# serve it with vLLM (scripts/run_vllm_servers.sh '...Embedding-0.6B:task=embed'; capitalized HF id). E.g.:
#   # TEST (the 203-question KARL set):
#   python3 -m qatfd.runner benchmarks=freshstack systems=search_agent experiments.split=test \
#       inference.emb_provider=vllm inference.emb_model_id=Qwen/Qwen3-Embedding-0.6B \
#       '++inference.vllm_base_urls={Qwen/Qwen3-Embedding-0.6B: "http://<host>:8100/v1"}' benchmarks.judge_model=<judge-model>
#   # DEV (iterate here; switch the whole topic with one override):
#   python3 -m qatfd.runner benchmarks=freshstack benchmarks.topic=laravel systems=search_agent \
#       experiments.split=test inference.emb_provider=vllm inference.emb_model_id=Qwen/Qwen3-Embedding-0.6B \
#       '++inference.vllm_base_urls={Qwen/Qwen3-Embedding-0.6B: "http://<host>:8100/v1"}' \
#       benchmarks.judge_model=<judge-model>
#   # (rag_llm baseline: add systems=rag_llm systems.top_k=10 to match KARL's k=10)
defaults:
  - base
  - _self_

name: freshstack
# dev/test split (generated by scripts/make_splits.py): dev = all laravel queries, test = all langchain.
# The split is by TOPIC (separate corpora): run the dev set with topic=laravel (the default) + split=dev,
# and the test set with topic=langchain + split=test. The split file's dev/test qid lists are disjoint,
# so a topic/split mismatch selects zero questions (aborts) rather than silently running the wrong set.
splits_path: freshstack/freshstack_splits.json
# the FreshStack topic to run; derives questions_path / corpus_path / collection_name below.
# dev = laravel (default); override `benchmarks.topic=langchain` (with experiments.split=test) for test.
topic: laravel
# base dir under qatfd/benchmarks/ holding each topic's data at {data_dir}/{topic}/{corpus,queries}.jsonl
data_dir: freshstack
# null => derived from topic: {data_dir}/{topic}/{queries,corpus}.jsonl and freshstack-{topic}-qwen-0.6b.
questions_path: null
corpus_path: null
collection_name: null
# weight for a partially-supported nugget in the recall score
partial_credit: 0.0
# llm used by the nugget-completion judge (set on the CLI, e.g. google/gemini-2.5-flash)
judge_model: null
prompts_path: null
