# base configuration for officeqa benchmark
defaults:
  - base
  - _self_

name: officeqa
# per-benchmark store under the benchmark dir (qatfd/benchmarks/officeqa/chromadb)
chromadb_dir: officeqa/chromadb
chromadb_collection: officeqa-qwen-8b
# dev/test split (generated by scripts/make_splits.py): dev = first 25% of queries, test = last 75%
splits_path: officeqa/officeqa_splits.json
csv_path: officeqa/officeqa_pro.csv
clean_page_map_path: officeqa/treasury_bulletins_cleaned/clean_page_map.json
prompts_path: officeqa/prompts.yaml
pdf_dir: officeqa/treasury_bulletin_pdfs
