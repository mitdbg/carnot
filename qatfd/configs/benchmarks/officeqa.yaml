# base configuration for officeqa benchmark
defaults:
  - base
  - _self_

name: officeqa
# slim per-benchmark store (carved out of the old shared .chromadb via export_chroma_collection.py)
chromadb_dir: .chromadb-officeqa-qwen-8b
chromadb_collection: officeqa-qwen-8b
# dev/test split (generated by scripts/make_splits.py): dev = first 25% of queries, test = last 75%
splits_path: splits/officeqa.json
csv_path: officeqa_pro.csv
clean_page_map_path: treasury_bulletins_cleaned/clean_page_map.json
test_set_uids_path: eval/test_set_uids.json
prompts_path: config/prompts/treasury_bulletin.yaml
pdf_dir: treasury_bulletin_pdfs
