# base configuration for browsecomp_plus benchmark
defaults:
  - base
  - _self_

name: browsecomp_plus
# slim per-benchmark store (carved out of the old shared .chromadb via export_chroma_collection.py)
chromadb_dir: .chromadb-browsecomp-plus-qwen-8b
chromadb_collection: browsecomp-plus-qwen-8b
# dev/test split (generated by scripts/make_splits.py): test = KARL's subset, dev = 50 sampled (seed 0)
splits_path: splits/browsecomp_plus.json
bcp_questions: browsecomp-plus/browsecomp_plus_decrypted.jsonl
bcp_metadata_glob: browsecomp-plus/browsecomp-plus-element-embeddings/metadata_rank*.json
bcp_test_ids_path: browsecomp-plus/karl_bcp_test_ids.json
judge_model: null
prompts_path: config/prompts/browsecomp_plus.yaml
