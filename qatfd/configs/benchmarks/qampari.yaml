# QAMPARI benchmark
#
# Corpus: KARL's QAMPARI corpus = the subset of QAMPARI's chunked Wikipedia (~100-token passages)
# containing >=1 gold answer entity (~256,680 chunks), embedded with Qwen3-Embedding-0.6B (1024-dim)
# into the `qwen-qampari-0.6b` Chroma collection. Build it offline:
#   1. download QAMPARI test data + chunked Wikipedia:
#        # test_data.jsonl  (questions): https://aggreg-qa.s3.amazonaws.com/qampari.zip
#        # chunked_wikipedia.tar.gz     : https://aggreg-qa.s3.amazonaws.com/chunked_wikipedia.tar.gz
#   2. filter the corpus to chunks containing a gold answer entity (-> ~256,680 chunks):
#        python engaging-scripts/preprocess_qampari_corpus.py \
#          --chunks_dir <wikipedia_chunks/chunks_v5> --questions <skunk>/qampari/test_data.jsonl \
#          --output_dir <skunk>/qampari/qampari-corpus
#   3. embed the filtered corpus:
#        python engaging-scripts/compute_qampari_embeddings.py \
#          --collection_dir <skunk>/qampari/qampari-corpus \
#          --output_dir     <skunk>/qampari/qampari-element-embeddings
#   4. build the Chroma collection:
#        python -m skunk.search_agent.prep.create_vector_db \
#          --embeddings-dir <skunk>/qampari/qampari-element-embeddings \
#          --collection-name qwen-qampari-0.6b --chroma-path <skunk>/.chromadb --benchmark qampari
#
# Runs MUST embed the query with the SAME 0.6B model, e.g.:
#   python3 -m qatfd.runner benchmarks=qampari systems=search_agent experiments.split=test \
#       systems.emb_model_id=qwen/qwen3-embedding-0.6b benchmarks.judge_model=<judge-model>
#   # (local backend: systems.emb_provider=local systems.emb_model_id=Qwen/Qwen3-Embedding-0.6B)
defaults:
  - base
  - _self_

name: qampari
chromadb_collection: qwen-qampari-0.6b
# 1000 multi-answer questions (qid / question_text / answer_list[].{answer_text, aliases, proof[]})
questions_path: qampari/test_data.jsonl
# chunk_id -> {cleaned, title, page_id, url} metadata produced by the embedding job
qampari_metadata_glob: qampari/qampari-element-embeddings/metadata_rank*.json
# null => all 1000 questions are the held-out test split (run with experiments.split=test)
test_ids_path: null
# weight for a partially-supported nugget (entity) in the recall score
partial_credit: 0.0
# llm used by the nugget-completion judge (set on the CLI, e.g. google/gemini-2.5-flash)
judge_model: null
prompts_path: null
