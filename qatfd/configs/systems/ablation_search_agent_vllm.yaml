# Example: ablation SearchAgent with its generation models served by LOCAL vLLM while the
# benchmark judge stays on OpenRouter. Routing is per call: any model listed in vllm_base_urls
# goes to its vLLM server; every other model (here: benchmarks.judge_model, and the OpenRouter
# embedding model) uses llm_provider. Launch the servers on the GPU box first —
#   ./scripts/run_vllm_servers.sh 'Qwen/Qwen3-32B:gpus=0:mem=0.9' 'Qwen/Qwen3-8B:gpus=1:mem=0.45'
# — then point the URLs below (the script prints/writes them) at that host. `name` stays
# ablation_search_agent so registry/system_config_factory resolve the same system class.
# Run e.g.:
#   python3 -m qatfd.runner systems=ablation_search_agent_vllm benchmarks=officeqa \
#       experiments.sample=2 benchmarks.judge_model=google/gemini-3.5-flash
defaults:
  - ablation_search_agent
  - _self_

# Agent model: the vLLM server's --served-model-name (run_vllm_servers.sh defaults it to the
# model id, so the vllm_base_urls key, this field, and the server all agree).
llm_model: Qwen/Qwen3-32B
tool_semantic_filter: true
# Token-heavy candidate filtering on a smaller local model; the agent keeps llm_model.
semantic_filter_model: Qwen/Qwen3-8B
# OpenRouter-only concept — meaningless against vLLM, keep unset.
semantic_filter_provider_order: null

vllm_base_urls:
  Qwen/Qwen3-32B: "http://localhost:8100/v1"
  Qwen/Qwen3-8B: "http://localhost:8101/v1"
# Models in vllm_base_urls cost $0 regardless of llm_prices (a price entry for OpenRouter
# runs of the same model is harmless). A local server has no provider-side rate limit, so
# lift the default 1000 RPM bucket for the served models.
llm_model_rpm:
  Qwen/Qwen3-32B: 100000
  Qwen/Qwen3-8B: 100000
# Optional vLLM-only request extras, e.g. disable Qwen3 thinking:
#   vllm_extra_body: {chat_template_kwargs: {enable_thinking: false}}
vllm_extra_body: null
