# Tool-ablation SearchAgent — inherits the vanilla search_agent config and adds three flags that
# toggle the discovery/narrowing tools (read_document + prune are always present). Defaults
# reproduce the vanilla SearchAgent (vector + grep, no semantic filter); override per run, e.g.
# systems.tool_vector=false systems.tool_semantic_filter=true.
defaults:
  - search_agent
  - _self_

name: ablation_search_agent
tool_vector: true            # search_corpus (vector search)
tool_grep: true              # grep_corpus (lexical search)
tool_semantic_filter: false  # semantic_filter (QATFD's tool)
# Model for the semantic_filter judge calls; null => use llm_model (the agent model). Set to a
# cheaper model to run the token-heavy candidate filtering off the expensive agent model.
semantic_filter_model: null
