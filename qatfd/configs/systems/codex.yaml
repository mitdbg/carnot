# codex system inherits from base config
defaults:
  - base
  - _self_

name: codex
agent_id: ${systems.name}
# path to the base config.toml which is copied into this run's codex home
codex_config_toml: ${benchmarks.codex_config_toml}
# path to the base AGENTS.md which is copied into this run's codex scratch directory
codex_agents_md: ${benchmarks.codex_agents_md}
# path to the example answer schema json file
codex_answer_schema_file: ${benchmarks.codex_answer_schema_file}
# used when codex_shell is true to place the scratch directory outside of the benchmarks directory
codex_scratch_dir: null
# whether or not to have codex resume its previous session across queries; only useful for sequential execution
session_resume: false
# whether or not to have codex use shell tools and write to AGENTS.md
codex_shell: false
# list of tools the codex agent may use
enabled_tools:
  - read_document
  - search_corpus
  - grep_corpus
# URL of the MCP server
mcp_url: ${benchmarks.mcp_url}
# style of corpus interaction for the codex system; one of "tools", "dci", or "both"
corpus_interaction: tools
# whether queries are executed in parallel or in sequence
run_mode: ${experiments.run_mode}
# token threshold at which codex auto-compacts the thread; null = codex default (90% of context window)
auto_compact_token_limit: null
