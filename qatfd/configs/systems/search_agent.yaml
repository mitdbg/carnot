# search agent system inherits from retrieve_compute base config
defaults:
  - retrieve_compute
  - _self_

name: search_agent
retrieve:
  max_output_tokens: 4096
  request_timeout_s: 120.0
  include_search_corpus: true
  include_grep_corpus: true
  include_semantic_filter: false
  chunks_per_summary: 10
  semantic_filter_max_workers: 16
  semantic_filter_max_candidate_docs: 1000
  semantic_filter_context_frac: 0.9
  # Model for the semantic_filter judge calls; null => use llm_model (the agent model). Set to a
  # cheaper model to run the token-heavy candidate filtering off the expensive agent model.
  semantic_filter_llm_model: null
  # OpenRouter provider order (no fallback) for the semantic_filter judge calls only; null => use the
  # client-wide llm_provider_order. Lets the judge route to specific providers (e.g. [akashml, parasail])
  # while a different-family agent model stays unpinned. E.g. systems.semantic_filter_provider_order=[akashml,parasail]
  semantic_filter_provider_order: null
  # output-token cap per semantic_filter judge call. Judge reasoning is disabled
  # (semantic_filter_disable_reasoning) and the reply is a single TRUE/FALSE token, so a tiny cap
  # suffices. If you re-enable reasoning, raise this too (a capped reasoning judge returns
  # finish_reason=length + empty content => retry storm that tanks throughput).
  semantic_filter_max_output_tokens: 4
  # Disable thinking on the judge calls (OpenRouter reasoning={"enabled": false}); set false (and
  # raise the cap above) for judge models that mandate reasoning.
  semantic_filter_disable_reasoning: true
  max_steps: 20
  max_misfires: 5
  max_parallel_chroma_queries: 16
  # target dollar cost budget for the search agent; null means no budget limit (default)
  cost_budget: null
  # target latency budget for the search agent; null means no latency limit (default)
  latency_budget: null
  # whether to turn the working set's intermediate collection off (ablation flag)
  working_set_collection_off: false
  # whether to turn off the working set's id-tracking for inclusion / exclusion filters (ablation flag)
  id_tracking_off: false
  # whether to fetch related working sets at the beginning of each agent execution
  fetch_related_working_sets: true
  # whether to enrich working sets with additional metadata;
  # - null means we do not perform enrichment
  # - "before" means we enrich as a pre-processing step before any queries arrive (BootstrapAgent)
  # - "after" means we enrich after queries arrive (EnrichAgent, every enrich_query_batch_size questions)
  # - "both" means we bootstrap before the first query AND enrich after every batch of queries
  enrich_working_sets: null
  # the batch size (in number of queries) to enrich working sets if enrich_working_sets="after"
  enrich_query_batch_size: null
  # hide the search agents' own docs_for_q* trajectory working sets from later search agents (they only see the
  # base collection plus the collections the Bootstrap / Enrich agents curated) and delete them after each Enrich
  # run; false = later search agents see and reuse earlier questions' trajectory working sets
  hide_and_clear_working_sets: true

  ### Bootstrap Agent Config ###
  bootstrap_config:
    agent_id: ${systems.name}-bootstrap
    # model for the bootstrap agent's own steps; null => inference.llm_model
    llm_model: null
    max_steps: 40
    semantic_map_max_workers: 16
    semantic_map_max_candidate_chunks: 10000
    semantic_map_context_frac: 0.9
    semantic_map_llm_model: null
    semantic_map_provider_order: null
    semantic_map_max_output_tokens: 4096
    semantic_map_disable_reasoning: true
    map_max_workers: 32
    max_parallel_chroma_queries: 16
    # target dollar cost budget for the bootstrap agent; null means no budget limit (default)
    cost_budget: null
    # target latency budget for the bootstrap agent; null means no latency limit (default)
    latency_budget: null
    # maximum number of chunks one create/add/copy/merge collection tool call may move
    max_copy_chunks: 100000
    # search / grep results are rendered as a summary: the first N chunks per collection, each
    # truncated to M characters (the full result set is still what gets added to a collection)
    search_preview_chunks: 10
    search_preview_chars: 400
    # number of sample rows rendered per collection after a map / semantic_map call
    map_preview_samples: 5

  ### Enrich Agent Config ###
  enrich_config:
    agent_id: ${systems.name}-enrich
    # model for the enrich agent's own steps; null => inference.llm_model
    llm_model: null
    max_steps: 20
    # the number of most recent queries (handled by the system) shown to the agent as the query workload
    max_previous_queries: 20
    semantic_map_max_workers: 16
    semantic_map_max_candidate_chunks: 10000
    semantic_map_context_frac: 0.9
    semantic_map_llm_model: null
    semantic_map_provider_order: null
    semantic_map_max_output_tokens: 4096
    semantic_map_disable_reasoning: true
    map_max_workers: 32
    max_parallel_chroma_queries: 16
    # target dollar cost budget for the bootstrap agent; null means no budget limit (default)
    cost_budget: null
    # target latency budget for the bootstrap agent; null means no latency limit (default)
    latency_budget: null
    # maximum number of chunks one create/add/copy/merge collection tool call may move
    max_copy_chunks: 100000
    # search / grep results are rendered as a summary: the first N chunks per collection, each
    # truncated to M characters (the full result set is still what gets added to a collection)
    search_preview_chunks: 10
    search_preview_chars: 400
    # number of sample rows rendered per collection after a map / semantic_map call
    map_preview_samples: 5
