# The in-pod scripts (files/*), mounted at /scripts. Kept in the chart rather than the image so the pod
# choreography can change without a rebuild; the image only has to provide python, aws and chroma.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-scripts
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "experiments.labels" . | nindent 4 }}
data:
{{ (.Files.Glob "files/*").AsConfig | indent 2 }}
