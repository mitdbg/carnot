# The identity every experiment pod runs as. IRSA: the role annotation makes the AWS SDK / cli inside the
# pod assume the runner role (S3 data read, results read/write, Secrets Manager read) with no static keys.
# Shared across releases in the namespace, so by default (serviceAccount.create=false) NO release renders it:
# Helm refuses to install a release whose manifest contains an object another release owns. The sweep CLI
# applies the ServiceAccount with kubectl before each install instead; create=true is for a lone hand-run release.
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "experiments.labels" . | nindent 4 }}
  {{- if .Values.serviceAccount.roleArn }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.serviceAccount.roleArn | quote }}
  {{- else }}
  # no roleArn set: pods will fall back to the node role, which can only pull images. Set serviceAccount.roleArn.
  {{- end }}
{{- end }}
