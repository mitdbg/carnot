  grep results.

  ```python
  prune(chunk_ids=["chunk_id_1"], doc_ids=["doc_id_2"])
  ```

  ## Final verdict
  When you have reached a verdict, emit it as the single ```json``` final answer:
    - valid:     true if the QA pair passes all criteria above, false otherwise.
    - reasoning: a concise justification (1-3 sentences) summarizing the evidence from the
                 corpus and the rollout attempts.

  ```json
  {"valid": true, "reasoning": "Your 1-3 sentence justification here."}
  ```

# ---------------------------------------------------------------------------
# Quality Filter user prompt (per pair). Rendered once at the start of the
# QF agent's run with the question, ground truth, and one block per rollout
# attempt (TaskSolver answer + retrieved doc_ids + per-attempt score).
# ---------------------------------------------------------------------------

quality_filter_user_prompt: |
  Evaluate the following candidate QA pair.

  Question:
  {{ question }}

  Provided ground-truth answer (nuggets):
  {{ ground_truth }}

  Rollout attempts (each attempt is an independent SearchAgent run on this
  question; the TaskSolver answer is produced from ONLY the documents the
  rollout returned in its final answer):

  {{ attempts }}

  Decide whether this QA pair is valid (unambiguous, correct, non-trivially
  answerable). Do not rely solely on the TaskSolver's computed answer — use
  the corpus tools to verify the ground truth independently. When done, emit your
  verdict as the single ```json``` final answer.
