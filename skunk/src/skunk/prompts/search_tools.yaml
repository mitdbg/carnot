grep_corpus: |-
  ### grep_corpus(pattern: str, read: bool = False, fetch: bool = False, metadata_filter: dict | None = None, limit: int | None = None, max_output_tokens: int | None = None)
  This tool performs a regex search over the corpus and returns the matching chunks grouped by their `doc_id`. Each hit includes its `chunk_id` so you can later refer to it or prune it. The output is unlimited by default (`limit=None` and `max_output_tokens=None`). This is useful for exhaustive queries -- "find every doc that mentions X" -- but you should pass `limit=N` or `max_output_tokens=M` for narrower exploratory searches. If the matches exceed the `max_output_tokens` cap, the result is truncated with a note telling you how many hits were omitted. You can optionally restrict the search to a subset of the corpus by passing a `metadata_filter`, which is a ChromaDB-style where clause over chunk metadata.

  Supported `metadata_filter` syntax:
  - Equality: `{"field": value}`
  - Set membership: `{"field": {"$in": [v1, v2, ...]}}`
  - Negation / not-in: `{"field": {"$nin": [...]}}`
  - Compound: `{"$and": [clause1, clause2, ...]}` or `{"$or": [...]}`

  Note that `max_output_tokens` will limit the number of tokens read, but not the number of tokens fetched. `limit` will limit the number of tokens read and fetched. 

  {% if working_set_collection_on or id_tracking_on %}
  The `fetch` and `read` arguments are booleans which help you control a "working set" of chunks and documents (shown below). Your working set contains a (possibly empty) subset of the entire corpus. {% if working_set_collection_on %} The working set can serve queries more quickly since it caches the subset in a smaller, more efficient collection. {% endif %} The working set also acts as a buffer between the raw corpus and your context window, allowing you to be selective about which tokens enter your window. There are three ways you can use `fetch` and `read` (at least one must be `True`):

  - `fetch=True` and `read=True`: the entire corpus is queried and the matching chunks are copied into the working set. These matching chunks are also placed immediately into your context window before the next step.
  - `fetch=True` and `read=False`: the entire corpus is queried and the matching chunks are copied into the working set. A short digest of the retrieved chunks and their estimated token sizes is placed into your context window before the next step.
  - `fetch=False` and `read=True`: only the working set is queried and the matching chunks are placed into your context window before the next step.
  {% endif %}

  {% if id_tracking_on %}
  Results are automatically de-duplicated against what you have already retrieved, and the rule depends on `read`:
  - Calls with `read=True` exclude chunks you have already read into your context window, so re-running a query surfaces material you have not seen yet — including chunks that were fetched earlier but never read.
  - Fetch-only calls (`read=False`) exclude chunks that are already in your working set, so repeated fetches only add new material.
  - Pruned chunks and documents are always excluded.
  (These rules apply at both the chunk and whole-document level: a document you read with `read_document` counts as fetched and read.) To revisit material you have already read, look back in your context window or call `read_document` with its `doc_id` — `read_document` results are never filtered.
  {% endif %}

  {% if working_set_collection_on or id_tracking_on %}
  ```python
  # fetch every chunk that mentions "topic X" (case insensitive) into the working set
  grep_corpus("(?i)topic X", fetch=True)
  ```

  ```python
  # fetch and read chunks matching the literal phrase "topic Y" within a filtered subset, capped at 50 hits
  grep_corpus("topic Y", read=True, fetch=True, metadata_filter={"field_a": {"$in": ["value_1", "value_2"]}}, limit=50)
  ```

  ```python
  # read the first ~5k tokens about topic Z from the working set
  grep_corpus("(?i)topic Z", read=True, max_output_tokens=5000)
  ```
  {% else %}
  ```python
  # find every chunk that mentions "topic X" (case insensitive)
  grep_corpus("(?i)topic X")
  ```

  ```python
  # find chunks matching the literal phrase "topic Y" within a filtered subset, capped at 50 hits
  grep_corpus("topic Y", metadata_filter={"field_a": {"$in": ["value_1", "value_2"]}}, limit=50)
  ```

  ```python
  # broad sweep, but keep the observation small: cap the output at ~5k tokens
  grep_corpus("(?i)topic Z", max_output_tokens=5000)
  ```
  {% endif %}

