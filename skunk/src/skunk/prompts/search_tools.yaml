read_document: |-
  ### read_document(doc_id: str | list[str], start_char_idx: int | None | list[int | None] = None, end_char_idx: int | None | list[int | None] = None)
  This tool returns the cleaned text of one or more documents, given their `doc_id`(s). You can optionally specify `start_char_idx` and `end_char_idx` to fetch only a substring of each document. If you pass a list for `doc_id`, `start_char_idx` and `end_char_idx` must be lists of the same length or `None`, and each index pair will be applied to the corresponding document. If `end_char_idx` exceeds the document length, the document will be truncated to its actual length. If `start_char_idx` is negative, it counts from the end of the document. If `end_char_idx` is negative, it counts from the end of the document.

  ```python
  # read two specific documents by id
  read_document(["doc_id_1", "doc_id_2"])
  ```

  ```python
  # read the first 1000 characters of a document
  read_document("doc_id_3", start_char_idx=0, end_char_idx=1000)
  ```

  ```python
  # read the last 1000 characters of a document and the full text of another document
  read_document(["doc_id_4", "doc_id_5"], start_char_idx=[-1000, None])
  ```

# NOTE: if you modify this string; update the docstring in `qatfd/scripts/codex_mcp_server.py` to match.
view_figure: |-
  ### view_figure(doc_id: str)
  When you read a document and see a `<figure id=N>` placeholder (a chart/figure that is NOT in the searchable text), call this tool to actually *see* it. It returns an image of the **entire page** — so you see every figure on the page in context — appended to your messages, just like reading the page's text. Use it to judge whether a page whose answer may live in a chart is relevant. Pass the `doc_id` of the page you read.

  ```python
  # you read doc_id "2002_12_8" and saw "<figure id=5>"; now view the page
  view_figure("2002_12_8")
  ```

prune: |-
  ### prune(chunk_ids: list[str] | None = None, doc_ids: list[str] | None = None)
  {% if working_set_collection_on or id_tracking_on %}
  This tool records `chunk_id`s and/or `doc_id`s that you've already inspected and deemed irrelevant. {% if id_tracking_on %} Pruned ids are excluded from the results of all subsequent corpus search/filter calls. {% endif %} Pruned ids are {% if id_tracking_on %} also {% endif %} dropped from your visible context and are excluded from working-set queries. Use this aggressively whenever a read surfaces clearly irrelevant chunks or docs, to keep later searches focused and keep your context window and working set manageable.
  {% else %}
  This tool removes `chunk_id`s and/or `doc_id`s that you've already inspected and deemed irrelevant from your visible context. Use this aggressively whenever a read surfaces clearly irrelevant chunks (or docs) to keep later searches focused and keep your context window manageable.
  {% endif %}

  ```python
  # mark some chunks and a whole doc as irrelevant
  prune(chunk_ids=["chunk_id_1", "chunk_id_2"], doc_ids=["doc_id_3"])
  ```

sem_filter_judge: |-
  Determine whether a document satisfies a filter condition. You are given a filter condition and a document. Output TRUE if the document satisfies the condition, and FALSE otherwise. Your reply must be exactly TRUE or FALSE — a single word, with no explanation, reasoning, or any other text.

# NOTE: if you modify this string; update the docstring in `qatfd/scripts/codex_mcp_server.py` to match.
sem_filter_tool: |-
  ### semantic_filter(predicate: str, read: bool = False, fetch: bool = False, metadata_filter: dict | None = None, top_k: int | None = None, search_str: str | None = None, pattern: str | None = None, limit: int | None = None)
  Keep only the documents whose FULL text satisfies a natural-language `predicate`: candidates are selected from the corpus, each is judged independently by an LLM (TRUE/FALSE), and the survivors are returned. Ideally, your candidate selection should limit the number of LLM invocations to <= 1000. To perform candidate selection, this tool accepts a `metadata_filter` (a ChromaDB-style where clause over chunk metadata).

  Supported `metadata_filter` syntax:
  - Equality: `{"field": value}`
  - Set membership: `{"field": {"$in": [v1, v2, ...]}}`
  - Negation / not-in: `{"field": {"$nin": [...]}}`
  - Compound: `{"$and": [clause1, clause2, ...]}` or `{"$or": [...]}`

  With only a `metadata_filter`, every matching chunk is a candidate. You can further sharpen your candidate selection by providing arguments for a vector search or grep command.

  **Vector Search:** to perform candidate selection with vector search, specify the parameters `top_k` and optionally `search_str`. Vector search will select the `top_k` most relevant chunks — embedding `search_str` if given, else the predicate; prefer a short focused `search_str` when the predicate is long or compound.

  **Grep:** to perform candidate selection with grep, specify the parameters `pattern` and optionally `limit`. The tool will filter for candidate chunks whose text matches the regular expression.

  {% if working_set_collection_on or id_tracking_on %}
  The `fetch` and `read` arguments are booleans which help you control a "working set" of chunks and documents (shown below). Your working set contains a (possibly empty) subset of the entire corpus which has been deemed relevant to your task. Once filled with documents and chunks, the working set can serve queries more quickly since it caches the subset in a smaller, more efficient collection. The working set also acts as a buffer between the raw corpus and your context window, allowing you to be selective about which tokens enter your window. There are three ways you can use `fetch` and `read` (at least one must be `True`):

  - `fetch=True` and `read=True`: the entire corpus is queried and the chunks which pass the filter (and their backing documents) are pulled into the working set. These chunks are also placed immediately into your context window before the next step.
  - `fetch=True` and `read=False`: the entire corpus is queried and the chunks which pass the filter (and their backing documents) are pulled into the working set. A short digest of the retrieved chunks and their estimated token sizes is placed into your context window before the next step.
  - `fetch=False` and `read=True`: the working set is queried and the chunks which pass the filter are placed into your context window before the next step.
  {% endif %}

  Candidate chunks are deduped to their parent documents before judging. {% if working_set_collection_on or id_tracking_on %} Chunks that have been pruned are automatically excluded from the results. Fetch-only calls automatically exclude material already in the working set (each document is fetched at most once), so repeated fetches surface new material. Read calls never exclude material: you can re-read the same working-set documents and chunks any number of times — e.g. to judge them against a different predicate. {% endif %}

  {% if working_set_collection_on or id_tracking_on %}
  ```python
  # metadata only: judge every document from 1946 in the working set
  semantic_filter(predicate="mentions coal shortages affecting steel production", read=True, metadata_filter={"year": "1946"})

  # vector prefilter: judge the documents behind the 200 chunks nearest a short query; fetch these into the working set without reading them yet
  semantic_filter(
      predicate="describes a government intervention in response to a labor strike, naming the statute invoked",
      fetch=True,
      top_k=200,
      search_str="government intervention strike",
  )

  # grep prefilter: judge the documents which match the regular expression; pull these documents and chunks into the working set and read the chunks directly
  semantic_filter(
      predicate="The document is a legal contract between ACME Corp. and one of their suppliers",
      read=True,
      fetch=True,
      pattern=r"(?i)ACME Corp(oration|\.)",
  )

  # metadata + vector prefilter: restrict candidates to a subset of years, then judge the documents behind the 300 nearest chunks; fetch the survivors into the working set
  semantic_filter(
      predicate="reports a change in the interest rate set by the central bank, stating the new rate",
      fetch=True,
      top_k=300,
      search_str="central bank interest rate change",
      metadata_filter={"year": {"$in": ["1951", "1952", "1953"]}},
  )

  # metadata + grep prefilter: within a filtered subset, judge the documents matching the regex (capped at 500 candidate chunks); fetch the survivors and read them directly
  semantic_filter(
      predicate="attributes a production slowdown to a shortage of a specific raw material",
      read=True,
      fetch=True,
      pattern=r"(?i)shortage",
      limit=500,
      metadata_filter={"$and": [{"field_a": "value_a"}, {"year": {"$nin": ["1946"]}}]},
  )
  ```
  {% else %}
  ```python
  # metadata only: judge every document from 1946 in the corpus
  semantic_filter(predicate="mentions coal shortages affecting steel production", metadata_filter={"year": "1946"})

  # vector prefilter: judge the documents behind the 200 chunks nearest a short query
  semantic_filter(
      predicate="describes a government intervention in response to a labor strike, naming the statute invoked",
      top_k=200,
      search_str="government intervention strike",
  )

  # grep prefilter: judge the documents which match the regular expression
  semantic_filter(
      predicate="The document is a legal contract between ACME Corp. and one of their suppliers",
      pattern=r"(?i)ACME Corp(oration|\.)",
  )

  # metadata + vector prefilter: restrict candidates to a subset of years, then judge the documents behind the 300 nearest chunks
  semantic_filter(
      predicate="reports a change in the interest rate set by the central bank, stating the new rate",
      top_k=300,
      search_str="central bank interest rate change",
      metadata_filter={"year": {"$in": ["1951", "1952", "1953"]}},
  )

  # metadata + grep prefilter: within a filtered subset, judge the documents matching the regex (capped at 500 candidate chunks)
  semantic_filter(
      predicate="attributes a production slowdown to a shortage of a specific raw material",
      pattern=r"(?i)shortage",
      limit=500,
      metadata_filter={"$and": [{"field_a": "value_a"}, {"year": {"$nin": ["1946"]}}]},
  )
  ```
  {% endif %}
