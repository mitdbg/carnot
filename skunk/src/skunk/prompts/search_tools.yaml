# NOTE: if you modify this string; update the docstring in `qatfd/scripts/codex_mcp_server.py` to match.
search_corpus: |-
  ### search_corpus(query: str, top_k: int, read: bool = False, fetch: bool = False, metadata_filter: dict | None = None)
  This tool performs a vector search over the corpus by embedding the input `query` and returning the `top_k` most relevant chunks, each labelled with its `chunk_id` and `doc_id`. You can optionally restrict the search to a subset of the corpus by passing a `metadata_filter`, which is a ChromaDB-style where clause over chunk metadata.

  Supported `metadata_filter` syntax:
  - Equality: `{"field": value}`
  - Set membership: `{"field": {"$in": [v1, v2, ...]}}`
  - Negation / not-in: `{"field": {"$nin": [...]}}`
  - Compound: `{"$and": [clause1, clause2, ...]}` or `{"$or": [...]}`

  {% if working_set_collection_on or id_tracking_on %}
  The `fetch` and `read` arguments are booleans which help you control a "working set" of chunks and documents (shown below). Your working set contains a (possibly empty) subset of the entire corpus. {% if working_set_collection_on %} The working set can serve queries more quickly since it caches the subset in a smaller, more efficient collection. {% endif %} The working set also acts as a buffer between the raw corpus and your context window, allowing you to be selective about which tokens enter your window. There are three ways you can use `fetch` and `read` (at least one must be `True`):

  - `fetch=True` and `read=True`: the entire corpus is queried and the `top_k` chunks are copied into the working set. These `top_k` chunks are also placed immediately into your context window before the next step.
  - `fetch=True` and `read=False`: the entire corpus is queried and the `top_k` chunks are copied into the working set. A short digest of the retrieved chunks and their estimated token sizes is placed into your context window before the next step.
  - `fetch=False` and `read=True`: only the working set is queried and the `top_k` chunks are placed into your context window before the next step.
  {% endif %}

  {% if id_tracking_on %}
  Results are automatically de-duplicated against what you have already retrieved, and the rule depends on `read`:
  - Calls with `read=True` exclude chunks you have already read into your context window, so re-running a query surfaces material you have not seen yet — including chunks that were fetched earlier but never read.
  - Fetch-only calls (`read=False`) exclude chunks that are already in your working set, so repeated fetches only add new material.
  - Pruned chunks and documents are always excluded.
  (These rules apply at both the chunk and whole-document level: a document you read with `read_document` counts as fetched and read.) To revisit material you have already read, look back in your context window or call `read_document` with its `doc_id` — `read_document` results are never filtered.
  {% endif %}

  {% if working_set_collection_on or id_tracking_on %}
  ```python
  # fetch the 1000 chunks most relevant to "topic X" into the working set
  search_corpus("topic X", top_k=1000, fetch=True)
  ```

  ```python
  # fetch and read the 100 chunks most relevant to "topic Y" within a filtered subset
  search_corpus("topic Y", top_k=100, read=True, fetch=True, metadata_filter={"$and": [{"field_a": "value_a"}, {"field_b": {"$in": [1, 2, 3]}}]})
  ```

  ```python
  # read the 20 chunks most relevant to "topic Z" from the working set
  search_corpus("topic Z", top_k=20, read=True)
  ```
  {% else %}
  ```python
  # find the 100 chunks most relevant to "topic X" anywhere in the corpus
  search_corpus("topic X", top_k=100)
  ```

  ```python
  # find the 50 chunks most relevant to "topic Y" within a filtered subset
  search_corpus("topic Y", top_k=50, metadata_filter={"$and": [{"field_a": "value_a"}, {"field_b": {"$in": [1, 2, 3]}}]})
  ```
  {% endif %}

