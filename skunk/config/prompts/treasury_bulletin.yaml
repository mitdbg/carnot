# Prompt overrides for the U.S. Treasury Monthly Bulletin corpus.
#
# Each entry adds a corpus blurb, a list of few-shot example strings, or a list
# of lessons to one or more target agents. Agents fish out their own entries
# at prompt-build time. See src/skunk/prompt_overrides.py for the schema
# and src/skunk/planner.py / src/skunk/subagents/*.py for how the entries
# are consumed.
#
# Few-shots are pre-formatted strings: whatever you write here lands verbatim
# under the agent's "## Few-shot examples" header, separated by blank lines.

overrides:
  # ---------------------------------------------------------------------
  # Corpus blurbs — one per agent that mentions the dataset.
  # ---------------------------------------------------------------------
  - section: corpus
    targets: [planner, replanner]
    content: |
      Questions are answered against the U.S. Treasury Monthly Bulletins,
      a 696-document corpus spanning 1939–2025. Emit period and as_of as
      canonical month ranges (YYYY-MM, YYYY-MM..YYYY-MM, or a comma-separated
      list of these), never natural language — expand fiscal years, calendar
      years, and quarters to months yourself per the date conventions below.

  # Shared date math — the planner expands question dates; the page-index build
  # agents resolve dates printed on a page. Same conventions, stated once.
  - section: corpus
    targets: [planner, replanner, page_scan, page_scan_vision, toc_outline, toc_reconstruct, chapter_merge, era_segment, era_merge]
    content: |
      Date conventions. Carefully distinguish fiscal year (FY) from calendar year
      (CY). Calendar year YYYY = YYYY-01..YYYY-12. Quarter Qn YYYY =
      that quarter's three months (Q2 2023 = 2023-04..2023-06). Fiscal year FYy =
      the 12 months ending in year y: (y-1)-10..y-09 from FY1977 on,
      (y-1)-07..y-06 before 1977 (FY2008 = 2007-10..2008-09;
      FY1939 = 1938-07..1939-06). The months 1976-07..1976-09 are the
      FY1976→FY1977 "transition quarter" and belong to neither fiscal year —
      pin them directly.

  - section: corpus
    targets: [extract.text, extract.vision]
    content: |
      The pages you receive are from the U.S. Treasury Monthly Bulletins.

  # Renders under the search-agent SYSTEM prompt's `## Dataset` header.
  # Lifted from the abandoned `officeqa_special_notes` blob in the old
  # `src/skunk/search_agent/prompts.yaml`.
  - section: corpus
    targets: [search_agent]
    content: |
      The corpus consists of U.S. Treasury bulletins from 1939 to 2025 Q3. From 1939-1982, every month had a single bulletin. Starting in 1983, bulletins were released quarterly (i.e. in months 3, 6, 9, and 12). Each bulletin is split into pages, and each page is treated as one "document" (with its own `doc_id`).

      ### Identifier formats
      - `doc_id`: `"<year>_<month>_<page_id>"` (e.g. `"2002_12_26"` = page 26 of the December 2002 bulletin). Use `page_id` as the index of the page in the bulletin, NOT the printed page number on the page itself (these may differ).
      - `chunk_id`: `"<doc_id>_<element_id>"` (e.g. `"1946_11_41_6"` = the 6th element on page 41 of the November 1946 bulletin).
      - In your final answer, the `page_keys` list holds `doc_id`s in the format above.

      ### Available metadata fields (for use with `metadata_filter`)
      Every chunk has the following metadata you can filter on:
      - `year`: zero-padded string, e.g. `"2010"`.
      - `month`: zero-padded string, e.g. `"03"` (only `"03"`, `"06"`, `"09"`, `"12"` from 1983 onward).
      - `page_id`: integer, the index of the page within its bulletin.
      - `doc_id`: string, the full page key (see above).
      - `type`: string, the element type (`"text"`, `"title"`, `"table"`, ...).

      ### Example `metadata_filter` clauses
      ```python
      # all pages from any month in 2008
      {"year": "2008"}

      # any Q1 bulletin in the 2010s, restricted to page index 26
      {"$and": [
          {"year": {"$in": [str(y) for y in range(2010, 2020)]}},
          {"month": "03"},
          {"page_id": 26},
      ]}

      # only table elements
      {"type": "table"}
      ```

  # ---------------------------------------------------------------------
  # Page-index build family — per-page scan, ToC extraction/reconstruction,
  # and the cross-issue chapter merge + era segmentation. All reason over the
  # same Treasury section taxonomy, so they share this corpus blurb.
  # ---------------------------------------------------------------------
  - section: corpus
    targets: [page_scan, page_scan_vision, toc_outline, toc_reconstruct, chapter_merge, era_segment, era_merge]
    content: |
      The pages are from the U.S. Treasury Monthly Bulletin — monthly
      federal-finance statistics (public debt, receipts/outlays, ownership of
      Treasury securities, exchange stabilization, foreign currency positions,
      trust funds). Resolve relative or partial dates against the publication
      month.

  - section: lessons
    targets: [page_scan, page_scan_vision]
    content: >
      A cumulative table of contents — a multi-month / multi-issue contents
      grid, usually at the back of the issue — is NOT the issue's table of
      contents; label it non_content.

  # ---------------------------------------------------------------------
  # Planner lessons — gotchas observed against this corpus.
  # ---------------------------------------------------------------------
  - section: lessons
    targets: [planner, replanner]
    content: |
      One concept per `retrieve.key`. If a question names multiple values (two currencies, two indices, two agencies, two bond classes, ...), emit ONE branch per value rather than bundling — branches run in parallel and splitting is cheap, while bundling forces retrieval to find a single page covering everything. 
      The converse also holds: one branch per concept. Do not emit several branches that re-describe the same table/statistic ("bids submitted for note X", "allotments of note X", "operations for note X" = ONE branch), and do not split the same concept across periods into same-key branches — use one branch with a comma-separated period ("1940-01..1940-12, 1953-01..1953-12").

  - section: lessons
    targets: [replanner]
    content: |
      When replanning, carefully review as_of first and prefer dropping it if its choice could have caused lookup failure. Only switch to external lookup if you are convinced that the retrieval term was correct and the corpus does not contain the information requested
  # ---------------------------------------------------------------------
  # Planner few-shots. Each entry is a pre-formatted block that lands
  # verbatim under the planner's "## Few-shot examples" header.
  # ---------------------------------------------------------------------
  - section: few_shots
    targets: [planner]
    content:
      - |
        ### Example (plain date range, NO bulletin named → period only; leave as_of null — do NOT infer a "vintage" issue from the data years. Same concept, two periods → ONE branch, comma-separated period)
        Q: Absolute percent change in national defense expenditures between CY1940 and CY1953, rounded to hundredths.
        Plan:
        ```json
        {
          "branches": [
            {"kind": "retrieve", "key": "national defense expenditures",
             "period": "1940-01..1940-12, 1953-01..1953-12"}
          ]
        }
        ```

      - |
        ### Example (a needed value looks external (CPI) — still emit a retrieve for it, keyed by the question's wording. If the corpus has no such value, the lookup is injected at replan; never emit lookup_external here.)
        Q: Real (CPI-adjusted, 2020 dollars) value of total national defense expenditures in CY1953.
        Plan:
        ```json
        {
          "branches": [
            {"kind": "retrieve", "key": "national defense expenditures",
             "period": "1953-01..1953-12"},
            {"kind": "retrieve", "key": "CPI",
             "period": "1953-01..1953-12"}
          ]
        }
        ```

      - |
        ### Example (named issue ≠ data window → as_of and period DIFFER)
        Q: Read the total debt held by the public for December 1985 from the chart in the September 1990 Treasury Bulletin.
        Plan:
        ```json
        {
          "branches": [
            {"kind": "retrieve", "key": "total debt held by the public",
             "period": "1985-12", "as_of": "1990-09",
             "visual_only": true}
          ]
        }
        ```

      - |
        ### Example (named issue applies to ONE period entry only → as_of array aligned with period entries, null = unpinned)
        Q: Difference between net interest outlays in FY1981 and the FY1980 figure as printed in the November 1981 Bulletin.
        Plan:
        ```json
        {
          "branches": [
            {"kind": "retrieve", "key": "net interest outlays",
             "period": "1980-10..1981-09, 1979-10..1980-09",
             "as_of": [null, "1981-11"]}
          ]
        }
        ```

      - |
        ### Example (vintage: data period ≠ report date; reprinted GDP via retrieve. Two concepts × two periods → TWO branches, comma-separated periods)
        Q: Using the figures reported in the September 2012 Treasury Bulletin, what was the change in federal debt held by the public as a percent of GDP between the end of fiscal year 2008 and fiscal year 2010?
        Plan:
        ```json
        {
          "branches": [
            {"kind": "retrieve", "key": "federal debt held by the public",
             "period": "2007-10..2008-09, 2009-10..2010-09", "as_of": "2012-09"},
            {"kind": "retrieve", "key": "GDP",
             "period": "2007-10..2008-09, 2009-10..2010-09", "as_of": "2012-09"}
          ]
        }
        ```


  # ---------------------------------------------------------------------
  # Replanner few-shots. Diff-shaped examples — the replanner emits a PlanDiff
  # (add/drop), not a whole Plan, so it does NOT share the planner few-shots
  # above (those render full `branches` plans). lookup_external is a REPLAN-ONLY
  # branch (the initial plan is retrieve-only), so the lookup-injection path is
  # shown here, not in the planner few-shots. The add/drop rules themselves live
  # in the replan system prompt and are not restated.
  # ---------------------------------------------------------------------
  - section: few_shots
    targets: [replanner]
    content:
      - |
        ### Example (one branch failed → drop it by index, re-add reworded; keep the branch that succeeded)
        prior_plan.branches:
          [0] {"kind": "retrieve", "key": "unemployment insurance tax receipts", "period": "2009-01..2009-12"}
          [1] {"kind": "retrieve", "key": "national defense expenditures", "period": "2009-01..2009-12"}
        Branch [0] FAILED: retrieval found no table named for "unemployment insurance
        tax receipts" — the corpus files these receipts under the Unemployment Trust
        Fund. Branch [1] succeeded and its value is already in prev.
        PlanDiff:
        ```json
        {
          "add": [
            {"kind": "retrieve", "key": "Unemployment Trust Fund receipts",
             "period": "2009-01..2009-12"}
          ],
          "drop": [0]
        }
        ```

      - |
        ### Example (a value is not in the corpus → drop the doomed retrieve, inject a lookup_external)
        prior_plan.branches:
          [0] {"kind": "retrieve", "key": "national defense expenditures", "period": "1953-01..1953-12"}
          [1] {"kind": "retrieve", "key": "CPI", "period": "1953-01..1953-12"}
        Branch [1] FAILED: no consumer-price index series anywhere in the Treasury
        Bulletin corpus. Branch [0] succeeded (in prev). What was missing: cpi:1953.
        The question named no publisher, so leave `src` null.
        PlanDiff:
        ```json
        {
          "add": [
            {"kind": "lookup_external",
             "target": "U.S. CPI-U annual average for 1953 (base 2020=100)"}
          ],
          "drop": [1]
        }
        ```


  # ---------------------------------------------------------------------
  # Corpus blurbs for the remaining executors.
  # ---------------------------------------------------------------------
  - section: corpus
    targets: [compute.codegen]
    content: |
      The values in `input_values` were extracted from U.S. Treasury Monthly
      Bulletin pages.

  # Shared unit vocabulary — emitted by compute and lookup_external alike.
  - section: corpus
    targets: [compute.codegen, lookup_external]
    content: |
      Unit tokens for this corpus: `usd`, `usd_thousands`, `usd_millions`,
      `usd_billions`, `pct`, `count`, `year`, `rate`, `fx_rate`, `cpi`, `text`.
      Foreign currency follows `<iso3>_<scale>` (e.g. `jpy_billions`,
      `gbp_millions`).

  - section: corpus
    targets: [lookup_external]
    content: |
      Lookups complement, rather than duplicate, the U.S. Treasury Monthly
      Bulletin corpus. Typical asks: macro / price series (CPI, GDP,
      population), FX spot rates, and entity facts that the bulletins
      do not carry directly.

  # ---------------------------------------------------------------------
  # Extract lessons
  # ---------------------------------------------------------------------
  - section: lessons
    targets: [extract.text, extract.vision]
    content: >
      Unit and scale come from the printed page — column header, caption,
      parenthetical legend, footnote like "(In millions of dollars)".
      Never guess from magnitude: if the page shows "74" under a "billions
      of yen" header, emit value=74 and unit=jpy_billions. Do not silently
      rescale or convert foreign currency to USD — leave it native.

  - section: lessons
    targets: [extract.text, extract.vision]
    content: >
      Watch for qualifier-mismatched rows. Treasury tables stack rows whose
      labels differ by a single subtle modifier — "Total Public Debt
      Securities" vs "Total interest-bearing debt", gross vs net, total vs
      a subtotal, "held by the public" vs "intragovernmental", outstanding
      vs issued. The lookup is satisfied only by a row matching the requested series
      including EVERY qualifier. Do not substitute a near-label row for the
      exact series. When the page has several qualifier-variants, emit each
      as its own entry with the page's verbatim row text in `description`
      (so the modifier is visible downstream) rather than collapsing to one.
      When the only row present is a near-match (the exact series is not on
      the page), still emit it, but make the qualifier difference explicit
      in `description` — never present it as the exact series.

  # ---------------------------------------------------------------------
  # Compute lessons.
  # ---------------------------------------------------------------------
  - section: lessons
    targets: [compute.codegen]
    content: >
      Prefer a printed total/summary row over re-aggregating its
      components when both are present in `input_values`. Bulletin tables
      print their own totals; the printed figure is authoritative and
      avoids rounding drift from summing parts.

  # ---------------------------------------------------------------------
  # Few-shots for compute executors.
  # ---------------------------------------------------------------------
  - section: few_shots
    targets: [compute.codegen]
    content:
      - |
        ### Example (closed-form, two scalars)
        Q: Absolute percent change in national defense expenditures between CY1940 and CY1953.
        input_values: two scalars — [0] national defense expenditures for CY1940, [1] same for CY1953, both unit=usd_millions.
        Why this shape: Identify each entry in the input_values block, reference it by index, apply (B-A)/A·100, abs(), format. No unit conversion needed (same scale).
        Output:
        ```python
        a = input_values[0].value  # national defense expenditures, CY1940
        b = input_values[1].value  # national defense expenditures, CY1953
        result = f'{abs((b - a) / a * 100):.2f}'
        ```

      - |
        ### Example (FX conversion)
        Q: JPY net options position in millions of USD, mid-March 2016.
        input_values: [0] scalar value=2300 unit=jpy_billions, [1] scalar unit=fx_rate description="JPY per USD spot, 2016-03".
        Why this shape: Foreign currency → find the fx_rate entry in the block, read direction from its description ("JPY per USD" → divide), then rescale billions → millions.
        Output:
        ```python
        jpy_b = input_values[0].value  # 2300, jpy_billions
        rate  = input_values[1].value  # JPY per USD spot → divide
        usd_m = jpy_b * 1000 / rate
        result = f'{usd_m:,.2f}'
        ```

      - |
        ### Example (missing-data signal — bare JSON, NO fence)
        Q: Real (CPI-adjusted, 2020 dollars) value of CY1953 national defense expenditures.
        input_values: only the nominal CY1953 scalar; no CPI series.
        Why this shape: Required deflator is not in input_values. Emit the bare missing-data JSON object (NO fence). Never fabricate.
        Output (literal, no fence in your reply):
        {"missing": ["cpi:1953", "cpi:2020"], "description": "no CPI series in input_values to convert nominal CY1953 to 2020 dollars"}

  # ---------------------------------------------------------------------
  # Few-shots for lookup_external.
  # ---------------------------------------------------------------------
  - section: few_shots
    targets: [lookup_external]
    content:
      - |
        ### Example (publisher pinned by `src`)
        Request:
        ```json
        {"target": "U.S. CPI-U annual average for 1953 (base 2020=100)",
         "src": "Bureau of Labor Statistics"}
        ```
        Why this shape: `src` pins BLS — query the BLS CPI series via the BLS tool, then commit ONE scalar value at the publisher's full printed precision. There is no separate source field — fold it into the description.
        Step (one tool call):
        ```python
        fetch_bls({"seriesid": ["CUUR0000SA0"], "startyear": "1953", "endyear": "1953"})
        ```
        Commit (after reading the observation):
        ```python
        final_answer({
            "description": "U.S. CPI-U annual average, 1953, rebased to 2020=100 (BLS)",
            "value": 14.4, "unit": "cpi"})
        ```

