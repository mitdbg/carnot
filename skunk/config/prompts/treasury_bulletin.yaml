# Prompt overrides for the U.S. Treasury Monthly Bulletin corpus.
#
# Each entry adds a corpus blurb, a list of few-shot example strings, or a list
# of lessons to one or more target agents. Agents fish out their own entries
# at prompt-build time. See src/skunk/prompt_overrides.py for the schema
# and src/skunk/planner.py / src/skunk/subagents/*.py for how the entries
# are consumed.
#
# Few-shots are pre-formatted strings: whatever you write here lands verbatim
# under the agent's "## Few-shot examples" header, separated by blank lines.

overrides:
  # ---------------------------------------------------------------------
  # Corpus blurbs — one per agent that mentions the dataset.
  # ---------------------------------------------------------------------
  - section: corpus
    targets: [planner]
    content: |
      Questions are answered against the U.S. Treasury Monthly Bulletins,
      a 696-document corpus of monthly Treasury bulletins (1939–2025) under
      the OfficeQA harness.

      Each bulletin is organized into recurring sections; the value a question
      needs almost always sits in one of them:
        - Profile of the Economy — U.S. macro conditions in narrative + charts:
          real GDP growth, employment/payrolls, unemployment, prices/inflation,
          and the personal saving rate (often plotted, not tabulated).
        - Federal Fiscal Operations — receipts, outlays, surplus/deficit by
          month/fiscal year, agency, and function.
        - Federal Debt — public debt outstanding, ownership of federal
          securities, and debt as a percent of GDP (carries nominal GDP).
        - Treasury financing & securities — auction results, offerings, and
          market quotations (yields and bid/ask prices) for bills, notes,
          bonds, and TIPS.
        - Trust funds — Social Security (OASI/DI), Highway, and other federal
          trust-fund receipts, expenditures, and balances.
        - International — foreign currency positions, Treasury reporting rates
          of exchange, and capital movements (TIC).

      Period-string syntax this corpus uses (free-form NL accepted; the
      examples below are the conventions most legible to the retriever):
        `CY1940`         calendar year 1940
        `FY1939`         fiscal year 1939
        `CY1953..CY1955` range, inclusive
        `2025-03`        single bulletin month
        `2025-03-31`     specific date

  - section: corpus
    targets: [extract.text]
    content: |
      The pages you receive are from the U.S. Treasury Bulletins.

  - section: corpus
    targets: [extract.vision]
    content: |
      The page images you receive are scanned pages from the U.S. Treasury
      Monthly Bulletins.

  # Renders under the search-agent SYSTEM prompt's `## Dataset` header.
  # Lifted from the abandoned `officeqa_special_notes` blob in the old
  # `src/skunk/search_agent/prompts.yaml`.
  - section: corpus
    targets: [search_agent]
    content: |
      The files consist of U.S. Treasury bulletins from 1939 to 2025 Q3. From 1939-1982, every month had a single bulletin. Starting in 1983, bulletins were released quarterly (i.e. in months 3, 6, 9, and 12).

  # ---------------------------------------------------------------------
  # Planner lessons — gotchas observed against this corpus.
  # ---------------------------------------------------------------------
  - section: lessons
    targets: [planner]
    content: |
      One concept per `retrieve.key`. If a question names multiple values (two currencies, two indices, two agencies, two bond classes, ...), emit ONE branch per value rather than bundling — branches run in parallel and splitting is cheap, while bundling forces retrieval to find a single page covering everything. A JPY-vs-GBP question should emit four branches (JPY position, GBP position, JPY/USD rate, GBP/USD rate), not one branch keyed "exchange rates for JPY and GBP".

      Default to `retrieve`. When in doubt about whether a value is in the corpus, use `retrieve` first — you will get a chance to replan it as a `lookup_external` if it turns out not to be there. The two errors are not symmetric: a `retrieve` that finds nothing fails loudly and is automatically replanned, whereas a wrong `lookup_external` silently returns a different (often later-revised) vintage and is never corrected. Reach for `lookup_external` only when the value has no plausible home in any Treasury Bulletin.

      Prefer the corpus ESPECIALLY for "as reported" / vintage questions. A live external lookup returns today's revised figures; a series like GDP is revised over time, so the bulletin's as-of-that-date value is the correct one and an external lookup would silently give a wrong number. Retrieve it from the named bulletin (set `as_of`).

  # ---------------------------------------------------------------------
  # Planner few-shots. Each entry is a pre-formatted block that lands
  # verbatim under the planner's "## Few-shot examples" header.
  # ---------------------------------------------------------------------
  - section: few_shots
    targets: [planner]
    content:
      - |
        ### Example
        Q: Absolute percent change in national defense expenditures between CY1940 and CY1953, rounded to hundredths.
        Why this shape: One closed-form calculation over two scalar lookups. The question pins the formula; one qualifier nails the absolute-vs-signed and percent-form choices.
        Plan:
        ```json
        {
          "branches": [
            {"kind": "retrieve", "key": "national defense expenditures",
             "period": "CY1940"},
            {"kind": "retrieve", "key": "national defense expenditures",
             "period": "CY1953"}
          ],
          "requirements": {
            "qualifiers": ["absolute value, not signed", "in percent form (multiply by 100)"],
            "units_out": "pct", "precision": 2
          }
        }
        ```

      - |
        ### Example
        Q: Real (CPI-adjusted, 2020 dollars) value of total national defense expenditures in CY1953.
        Why this shape: Nominal value from the corpus, deflator from outside it. A qualifier pins the deflator direction. `src` biases the external lookup toward the canonical BLS series.
        Plan:
        ```json
        {
          "branches": [
            {"kind": "retrieve", "key": "national defense expenditures",
             "period": "CY1953"},
            {"kind": "lookup_external",
             "target": "U.S. CPI-U annual average for 1953 (base 2020=100)",
             "src": "Bureau of Labor Statistics"}
          ],
          "requirements": {
            "qualifiers": ["real = nominal / (CPI / 100); the result is already in 2020 dollars, no further scaling"],
            "units_out": "usd_millions"
          }
        }
        ```

      - |
        ### Example
        Q: Read the total debt held by the public from the September 1990 Treasury Bulletin chart on page 5.
        Why this shape: Chart read with visual_only=True. Direct lookup, no calculation, no qualifiers.
        Plan:
        ```json
        {
          "branches": [
            {"kind": "retrieve", "key": "chart of total debt held by the public",
             "period": "1990-09",
             "visual_only": true}
          ],
          "requirements": {"qualifiers": []}
        }
        ```

      - |
        ### Example (multi-period external series: ONE branch, list payload)
        Q: Sum of annual U.S. CPI-U for 1950, 1951, and 1952.
        Why this shape: Same external series across consecutive years → ONE lookup_external branch with a multi-period target, NOT three. The lookup agent returns a labeled series (a vector keyed by year); compute sums it.
        Plan:
        ```json
        {
          "branches": [
            {"kind": "lookup_external",
             "target": "U.S. CPI-U annual averages for 1950, 1951, 1952",
             "src": "Bureau of Labor Statistics"}
          ],
          "requirements": {
            "qualifiers": [],
            "units_out": "cpi"
          }
        }
        ```

      - |
        ### Example (vintage: data period ≠ report date; reprinted GDP via retrieve)
        Q: Using the figures reported in the September 2012 Treasury Bulletin, what was the change in federal debt held by the public as a percent of GDP between the end of fiscal year 2008 and fiscal year 2010?
        Why this shape: An "as reported in bulletin Y" (vintage) question. The DATA periods are FY2008 and FY2010 → `period`; the reporting vintage is the Sept-2012 bulletin → `as_of`. Never put the report year (2012) in `period` — that is what `as_of` is for. GDP is reprinted in the Bulletin's debt-to-GDP tables, so it is a `retrieve` of the as-of-2012 vintage, NOT a `lookup_external` (which would return today's revised GDP → wrong answer). One branch per (series, period).
        Plan:
        ```json
        {
          "branches": [
            {"kind": "retrieve", "key": "federal debt held by the public",
             "period": "FY2008", "as_of": "September 2012 bulletin"},
            {"kind": "retrieve", "key": "federal debt held by the public",
             "period": "FY2010", "as_of": "September 2012 bulletin"},
            {"kind": "retrieve", "key": "nominal gross domestic product",
             "period": "FY2008", "as_of": "September 2012 bulletin"},
            {"kind": "retrieve", "key": "nominal gross domestic product",
             "period": "FY2010", "as_of": "September 2012 bulletin"}
          ],
          "requirements": {
            "qualifiers": [],
            "units_out": "pct", "precision": 1
          }
        }
        ```

  # ---------------------------------------------------------------------
  # Corpus blurbs for the remaining executors.
  # ---------------------------------------------------------------------
  - section: corpus
    targets: [compute.codegen, compute.critique]
    content: |
      The values in `input_values` were extracted from U.S. Treasury Monthly
      Bulletin pages. Common units in this corpus: `usd`, `usd_thousands`,
      `usd_millions`, `usd_billions`, `pct`, `count`, `year`, `rate`,
      `fx_rate`, `text`. Foreign currency follows `<iso3>_<scale>`
      (e.g. `jpy_billions`, `gbp_millions`).

  - section: corpus
    targets: [lookup_external]
    content: |
      Lookups complement, rather than duplicate, the U.S. Treasury Monthly
      Bulletin corpus. Typical asks: macro / price series (CPI, GDP,
      population), FX spot rates, and entity facts that the bulletins
      do not carry directly.

  # ---------------------------------------------------------------------
  # Extract lessons — gotchas observed against this corpus.
  # ---------------------------------------------------------------------
  - section: lessons
    targets: [extract.text]
    content: >
      Vector vs table for 2-D grids: when the page prints a 2-D year×month
      grid but the question reads as a 1-D series ("every month from X to
      Y"), emit ONE vector with combined ISO keys ("1942-03", "1942-04",
      ...) rather than a table. Use table only when the question genuinely
      compares rows against columns.

  - section: lessons
    targets: [extract.text, extract.vision]
    content: >
      Unit and scale come from the printed page — column header, caption,
      parenthetical legend, footnote like "(In millions of dollars)".
      Never guess from magnitude: if the page shows "74" under a "billions
      of yen" header, emit value=74 and unit=jpy_billions. Do not silently
      rescale or convert foreign currency to USD — leave it native, and
      downstream compute will apply the FX rate.

  - section: lessons
    targets: [extract.text, extract.vision]
    content: >
      Unit tokens for this corpus: `usd`, `usd_thousands`, `usd_millions`,
      `usd_billions`, `pct`, `count`, `year`, `rate`, `fx_rate`, `text`.
      Foreign currency follows `<iso3>_<scale>` (e.g. `jpy_billions`,
      `gbp_millions`). Use `mixed` only when one cell genuinely combines
      incompatible units.

  # ---------------------------------------------------------------------
  # Compute lessons.
  # ---------------------------------------------------------------------
  - section: lessons
    targets: [compute.codegen]
    content: >
      Numeric modifiers — each modifier present in the question (or echoed
      in `requirements.qualifiers`) MUST appear as an explicit operation, not a
      comment. Common forms: `signed` vs `absolute` — never silently abs()
      a value meant signed; `normalized` / `midpoint normalized` — apply
      explicitly ((V2-V1)/((V1+V2)/2)); `log of` / `ln(...)` — wrap in
      np.log; `per capita` — divide by population; `in percent form` vs
      `as a decimal` — scale by 100 and format the result string to match.

  - section: lessons
    targets: [compute.codegen]
    content: >
      FX direction: when the question wants USD and an input is foreign
      (`<iso3>_<scale>`), locate the matching `fx_rate` entry and apply
      it — `value * rate` if the rate is "USD per <iso>", `value / rate`
      if "<iso> per USD". Read the rate's description for direction; do
      not guess.

  - section: lessons
    targets: [compute.codegen]
    content: >
      Scale conversion: if a value is in `usd_thousands` and `units_out`
      is `usd_millions`, divide by 1000 — apply the conversion once over
      the whole payload, never cell-by-cell.

  - section: lessons
    targets: [compute.codegen]
    content: >
      Prefer a printed total/summary row over re-aggregating its
      components when both are present in `input_values`. Bulletin tables
      print their own totals; the printed figure is authoritative and
      avoids rounding drift from summing parts.

  # ---------------------------------------------------------------------
  # lookup_external lessons.
  # ---------------------------------------------------------------------
  - section: lessons
    targets: [lookup_external]
    content: >
      Unit tokens commonly used here: `year`, `cpi`, `fx_rate`,
      `usd_millions`, `usd_billions`, `pct`, `count`, `rate`, `text`.

  # ---------------------------------------------------------------------
  # Few-shots for compute executors.
  # ---------------------------------------------------------------------
  - section: few_shots
    targets: [compute.codegen]
    content:
      - |
        ### Example (closed-form, two scalars)
        Q: Absolute percent change in national defense expenditures between CY1940 and CY1953.
        input_values: two scalars — national defense expenditures for CY1940 and for CY1953, both unit=usd_millions.
        Why this shape: Pick each by its description, apply (B-A)/A·100, abs(), format. No unit conversion needed (same scale).
        Output:
        ```python
        a = next(e for e in input_values if 'CY1940' in e.description).value
        b = next(e for e in input_values if 'CY1953' in e.description).value
        result = f'{abs((b - a) / a * 100):.2f}'
        ```

      - |
        ### Example (FX conversion)
        Q: JPY net options position in millions of USD, mid-March 2016.
        input_values: scalar value=2300 unit=jpy_billions, and scalar unit=fx_rate description="JPY per USD spot, 2016-03".
        Why this shape: Foreign currency → locate the fx_rate, read direction from its description ("JPY per USD" → divide), then rescale billions → millions.
        Output:
        ```python
        jpy_b = next(e for e in input_values if e.unit == 'jpy_billions').value
        rate  = next(e for e in input_values if e.unit == 'fx_rate').value  # JPY per USD
        usd_m = jpy_b * 1000 / rate
        result = f'{usd_m:,.2f}'
        ```

      - |
        ### Example (missing-data signal — bare JSON, NO fence)
        Q: Real (CPI-adjusted, 2020 dollars) value of CY1953 national defense expenditures.
        input_values: only the nominal CY1953 scalar; no CPI series.
        Why this shape: Required deflator is not in input_values. Emit the bare missing-data JSON object (NO fence). Never fabricate.
        Output (literal, no fence in your reply):
        {"missing": ["cpi:1953", "cpi:2020"], "description": "no CPI series in input_values to convert nominal CY1953 to 2020 dollars"}

  # ---------------------------------------------------------------------
  # Few-shots for the compute self-critique. Each shows ONE focus
  # (a single qualifier OR the output-format fields), the code that ran,
  # the result, and the bare-JSON verdict. Mined from real dev traces.
  # Discipline: judge ONLY the assigned constraint; a clean result that
  # violates some OTHER constraint is still an accept here.
  # ---------------------------------------------------------------------
  - section: few_shots
    targets: [compute.critique]
    content:
      - |
        ### Example (accept — qualifier honored)
        Question: Absolute difference between the Feb and May figures, in millions, rounded to hundredths.
        Constraint to check (a qualifier):
        absolute value, not signed
        Code that ran:
        ```python
        a = next(e for e in input_values if 'Feb' in e.description).value
        b = next(e for e in input_values if 'May' in e.description).value
        result = f"{abs(a - b):.2f}"
        ```
        Produced result: 11.60
        Why: the qualifier demands an unsigned magnitude; `abs(...)` applies it
        explicitly and the value is non-negative. This one constraint is honored,
        so accept — rounding/units are someone else's focus.
        Output: {"verdict": "accept"}

      - |
        ### Example (revise — qualifier: a required intermediate step is missing)
        Question: H-spread of the annual debt values, with intermediate values rounded to the tenths of a billion.
        Constraint to check (a qualifier):
        intermediate values rounded to the tenths of a billion
        Code that ran:
        ```python
        q1 = np.percentile(vals, 25)
        q3 = np.percentile(vals, 75)
        result = f"{q3 - q1:.2f}"
        ```
        Produced result: 41.27
        Why: the qualifier requires Q1 and Q3 to be rounded to a tenth of a billion
        BEFORE the spread is taken; the code subtracts the raw quartiles. A modifier
        named in the question is absent as an explicit operation → revise.
        Output: {"verdict": "revise", "reason": "Q1 and Q3 are not rounded to the tenths of a billion before the subtraction the qualifier requires; round each (e.g. round(q, 1)) before computing the spread."}

      - |
        ### Example (revise — output-format: unit symbol missing)
        Question: Percent change between the two figures, expressed as a percent, rounded to two decimals.
        Constraint to check (the output-format fields):
        {"units_out": "pct", "precision": 2, "answer_form": null}
        Code that ran:
        ```python
        result = f"{(b - a) / a * 100:.2f}"
        ```
        Produced result: 6.14
        Why: units_out is `pct`, so the rendered answer must carry the `%` sign;
        `6.14` omits it. The numeric value and 2-dp precision are correct, but this
        focus is the rendering → revise.
        Output: {"verdict": "revise", "reason": "units_out is 'pct' but the result '6.14' has no '%' sign; render it as '6.14%'."}

  # ---------------------------------------------------------------------
  # Few-shots for lookup_external.
  # ---------------------------------------------------------------------
  - section: few_shots
    targets: [lookup_external]
    content:
      - |
        ### Example (publisher pinned by `src`)
        Request:
        ```json
        {"target": "U.S. CPI-U annual average for 1953 (base 2020=100)",
         "src": "Bureau of Labor Statistics"}
        ```
        Why this shape: `src` pins BLS — query the BLS CPI series via the BLS tool, then commit ONE scalar value at the publisher's full printed precision. There is no separate source field — fold it into the description.
        Step (one tool call):
        ```python
        fetch_bls({"seriesid": ["CUUR0000SA0"], "startyear": "1953", "endyear": "1953"})
        ```
        Commit (after reading the observation):
        ```python
        final_answer({
            "description": "U.S. CPI-U annual average, 1953, rebased to 2020=100 (BLS)",
            "value": 14.4, "unit": "cpi"})
        ```

