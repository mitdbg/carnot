
# =====================================================================
# OfficeQA prompt overrides — U.S. Receipts & Expenditures corpus
#
# Same schema and style as config/prompts/treasury_bulletin.yaml: each block is
# injected into the prompt(s) of the agent(s) in `targets`, under the header named
# by `section`:
#   corpus     — background on the dataset (what it is / how it is addressed)
#   lessons    — terse imperative rules the agent must follow
#   few_shots  — worked examples appended verbatim under "## Few-shot examples"
# As in treasury_bulletin.yaml, the search_agent blurb additionally carries the
# retrieval index contract (file_id/doc_id/chunk_id string format, metadata_filter
# key names) it needs to drive its corpus tools.
#
# Blocks are grouped below by pipeline stage for editing, but the prompt builder
# regroups them by section per target: corpus (## Dataset) → few-shot examples
# (## Few-shot examples) → lessons (## Lessons learned). Within a section, blocks
# appear to the agent in this file order.
# =====================================================================

overrides:

  # -------------------------------------------------------------------
  # SHARED — fiscal/calendar/publication date math.
  # Used by the planner (to expand a question's dates into month ranges)
  # and by the page-index build agents (to resolve dates printed on a page).
  # -------------------------------------------------------------------
  - section: corpus
    targets: [planner, replanner, page_scan, page_scan_vision, toc_outline, toc_reconstruct, chapter_merge, era_segment, era_merge]
    content: |
      Date conventions. Carefully distinguish (a) the fiscal year a statement
      REPORTS, (b) the year it was PUBLISHED, and (c) calendar vs fiscal year.
      Combined_statement documents are keyed by the fiscal year they report;
      govinfo_receipts documents are keyed by the calendar DATA year they report
      and were printed about a year later (the 1824 volume reports the year 1824
      and was printed in 1825); some volumes span two data years and are keyed by
      the first. Calendar year YYYY = YYYY-01..YYYY-12. Fiscal year FYy = the 12
      months ending in year y: (y-1)-10..y-09 from FY1977 on, (y-1)-07..y-06
      through FY1976 (FY1968 = 1967-07..1968-06; FY2008 = 2007-10..2008-09). The
      months 1976-07..1976-09 are the FY1976→FY1977 "transition quarter" and
      belong to NEITHER fiscal year (unrelated to the 1995–2000 "transition"
      era). Before 1842 the federal fiscal year was the calendar year —
      relevant only to the early govinfo volumes, since combined_statement
      begins in FY1872.

  # -------------------------------------------------------------------
  # PLANNER / REPLANNER — turn a question into a typed retrieve/compute plan.
  # -------------------------------------------------------------------

  # Corpus scope + the required canonical period format.
  - section: corpus
    targets: [planner, replanner]
    content: |
      Questions are answered against the U.S. Receipts & Expenditures corpus:
      the annual "Combined Statement of Receipts and Expenditures of the United
      States" (fiscal years 1872–2024) plus the early govinfo receipts volumes
      (data years ~1793–1893). Emit period as canonical month ranges
      (YYYY-MM, YYYY-MM..YYYY-MM, or a comma-separated list of these), never
      natural language — expand fiscal years, calendar years, and quarters to
      months yourself per the date conventions above. The data is annual
      (fiscal-year totals and year-end balances), so most periods are whole
      fiscal years.


  # Renders under the search-agent SYSTEM prompt's `## Dataset` header.
  # Like treasury_bulletin.yaml's search_agent blurb, this carries the index
  # contract (file_id/doc_id/chunk_id format, metadata_filter keys) the agent
  # needs to drive its search_corpus / grep_corpus / read_document tools.
  - section: corpus
    targets: [search_agent]
    content: |
      The corpus is the U.S. "Combined Statement of Receipts and Expenditures
      of the United States" (annual; fiscal years 1872–2024, in three eras:
      historical FY1872–FY1994, transition FY1995–2000, modern FY2001–FY2024)
      plus the early govinfo receipts-and-expenditures volumes (annual; data
      years ~1793–1893, each printed about a year later, heterogeneous — some
      whole-government, some a single department such as the Post Office). Each source document is
      split into pages, and each page into elements. The PDFs are image-only
      scans, so all text and tables are OCR/VLM-extracted.

      Combined_statement filenames encode the era (historical / transition /
      modern), the fiscal year, and a section/chapter code: `cNN` chapter, `scN`
      schedule, plus `rta`/`rtb`/`rtc`, `tbb`/`tbj`, `bof`, `coa`, `pre`,
      `outlay`, `finhigh`, `sur`, `receipt`, `*ltr` (transmittal letters).
      Modern chapter codes are stable across years; monolithic historical
      volumes carry no section code. Govinfo filenames carry the calendar DATA
      year the volume reports and an opaque GovInfo document id; the volume was
      printed about a year later. A page's printed page number (OCR'd, mixing Roman and Arabic
      numerals, with gaps) is not its position within the document.

      ### Identifier formats
      - `file_id`: `"<collection>__<source>__<slug>"` — one source document.
        `<collection>` is `combined_statement` or `govinfo_receipts`. For
        combined_statement, `<source>` is the era (`historical` / `transition` /
        `modern`); for govinfo_receipts it is the calendar DATA year the volume
        reports (printed about a year later). The `<slug>`
        carries the year and section/chapter (see filename codes above). Examples:
        `"combined_statement__historical__cs-1872"` (monolithic, one file per
        fiscal year), `"combined_statement__modern__2001__c01"` (year + chapter
        code), `"combined_statement__transition__CS_1995_Appendix"` /
        `"combined_statement__transition__annrpt95"`,
        `"govinfo_receipts__1827__GOVPUB-T-<hash>"` (also `SERIALSET-...` ids).
      - `doc_id`: `"<file_id>_<page_id>"` (e.g. `"combined_statement__historical__cs-1872_5"`
        = page index 5 of that file). `page_id` is the page's index in the file,
        NOT the printed page number on the page itself (these differ).
      - `chunk_id`: `"<doc_id>_<element_id>"` (e.g. `"combined_statement__historical__cs-1872_5_1"`
        = element 1 on page index 5 of that file).
      - In your final answer, the `doc_ids` list holds `doc_id`s in the format above.

      ### Available metadata fields (for use with `metadata_filter`)
      Every chunk has the following metadata you can filter on:
      - `year`: integer, e.g. `1872` (NOT a zero-padded string). For
        combined_statement this is the REPORTING fiscal year; for govinfo_receipts
        it is the calendar DATA year the volume reports (the volume was printed
        about a year later). Range 1793–2024.
      - `source`: string, one of `"historical"`, `"transition"`, `"modern"` (the
        three combined_statement eras) or `"govinfo_receipts"`.
      - `file_id`: string, the source document (see above).
      - `doc_id`: string, the full page key (see above).
      - `page_id`: integer, the index of the page within its file.
      - `element_id`: integer, the index of the element within its page.
      - `type`: string, the element type. The complete set is `"table"`,
        `"section_header"`, `"text"`, `"title"`, `"footnote"`, `"caption"`.

      ### Example `metadata_filter` clauses
      ```python
      # all elements from documents reporting/published in 1885
      {"year": 1885}

      # modern-era combined_statement (FY2001 on), tables only
      {"$and": [
          {"source": "modern"},
          {"type": "table"},
      ]}

      # govinfo receipts volumes published across the 1820s
      {"$and": [
          {"source": "govinfo_receipts"},
          {"year": {"$in": list(range(1820, 1830))}},
      ]}

      # a single document, restricted to table elements
      {"$and": [
          {"file_id": "combined_statement__historical__cs-1872"},
          {"type": "table"},
      ]}
      ```

  # ---------------------------------------------------------------------
  # Page-index build family — per-page scan, ToC extraction/reconstruction,
  # cross-issue chapter merge + era segmentation. Shared structure blurb.
  # ---------------------------------------------------------------------
  - section: corpus
    targets: [page_scan, page_scan_vision, toc_outline, toc_reconstruct, chapter_merge, era_segment, era_merge]
    content: |
      Pages report annual federal receipts, expenditures, and balances.
      Receipts are organized by source (customs, internal revenue, sales of
      public lands, postage, miscellaneous) and by collection district / port /
      state; expenditures by department and object, or "head of appropriation"
      (early volumes: the Departments of War, the Navy, State, the Treasury, the
      Judiciary, Indian affairs, foreign intercourse, pensions, and interest and
      redemption of the public debt; later volumes use the agencies of the day);
      balances by fund (general, special, trust). The specific categories vary
      by era. The documents come in two SERIES with different structure:
        - Detailed "Combined Statement" / "Appendix": front matter (transmittal
          letter → preface / "bases of figures" / explanation of accounts →
          CONTENTS) → PART ONE..FIVE → TABLE A–H → Schedule 1..N →
          organizational-unit breakdowns. Monolithic through the 1970s;
          pre-split one-chapter-per-file (cNN / scN) in the modern era and the
          1998–2000 transition "appendix".
        - Slim "Annual Report": narrative sections only — Preface, Secretary's
          Letter, Financial Highlights, Financial Review, Financial Statements,
          Notes.
      Table-of-contents presence varies by era/series: 1872–1920 detailed
      volumes have no front ToC (sections appear as in-body ALL-CAPS
      organizational headings such as "INDEPENDENT TREASURY", "MINTS AND ASSAY
      OFFICES"); 1921–1973 detailed volumes and the slim Annual Reports have a
      front ToC; 1995–2000 detailed appendices have a front (sometimes also
      back) ToC; 2001+ documents are pre-split per chapter; and the early
      govinfo volumes carry an index of their statements.

  # ---------------------------------------------------------------------
  # Corpus blurbs for the remaining executors.
  # (compute.codegen's input-provenance blurb lives in the COMPUTE section below.)
  # ---------------------------------------------------------------------
  # Unit vocabulary — every entry carries a natural-language unit, whether it was
  # looked up externally or extracted from the corpus; compute reconciles them.
  - section: corpus
    targets: [compute.codegen, lookup_external]
    content: |
      Units are natural language on every entry. Externally looked-up values
      carry a free-form unit (e.g. "percent", "millions of dollars", "British
      pounds per U.S. dollar"); corpus-extracted entries carry the unit printed
      on the page (e.g. "dollars", "thousands of dollars"); early volumes often
      print exact dollars-and-cents.

  - section: corpus
    targets: [lookup_external]
    content: |
      Lookups complement, rather than duplicate, the Combined Statement corpus,
      which does not carry macro / price series (CPI, GDP, population), FX spot
      rates, or external entity facts.

  # ---------------------------------------------------------------------
  # Page-index build family lessons.
  # ---------------------------------------------------------------------
  - section: lessons
    targets: [page_scan, page_scan_vision]
    content: >
      A cumulative / multi-year contents grid (often at the back of a volume)
      is NOT that volume's table of contents; label it non_content. The
      transmittal letters and CONTENTS pages at the front are not body sections.
      Treat repeated running banners ("SUMMARY STATEMENTS") and "— Continued"
      headers as continuations, not new sections.

  - section: lessons
    targets: [toc_outline, toc_reconstruct]
    content: |
      When a CONTENTS table is present, read it as (section title, printed page) pairs, then resolve each printed page to a page index via the page_number elements (interpolate across unnumbered / Roman front-matter / plate pages). Validated example: a 1968 ToC entry "Table A ... 8" resolves to page index 18, where the TABLE A title actually appears.
      Where no front ToC exists (1872–1920 detailed volumes), derive sections from the in-body ALL-CAPS organizational headings instead. Normalize OCR heading variants before matching ("Table A.", "TABLE A —", "Table A - Schedule 8" are one family).

  - section: lessons
    targets: [era_segment, era_merge, chapter_merge]
    content: |
      Segment at the Table/Schedule level (PART/SECTION is too coarse, individual pages too fine); anchor every boundary on the page index, never the printed page number.
      Modern (2001+) and 1998–2000 transition "appendix" documents are already one-chapter-per-file — take the section from the slug, do not re-segment. Align the same section across issues by its printed Table/Schedule label.
      Respect the FY1976→FY1977 fiscal-basis change (July-start through FY1976, October-start from FY1977) when aligning years across eras; the 1976 transition quarter belongs to no fiscal year.

  # ---------------------------------------------------------------------
  # Planner / replanner lessons.
  # Lesson: how to shape branches — one concept per key, split values but not
  # periods, and keep the period the DATA window (not a publication vintage).
  # ---------------------------------------------------------------------
  - section: lessons
    targets: [planner, replanner]
    content: |
      One concept per `retrieve.key`. If a question names multiple values (two funds, two agencies, two revenue sources, receipts vs expenditures, ...), emit ONE branch per value rather than bundling.
      The converse also holds: do not split the same statistic across periods into same-key branches — use one branch with a comma-separated period ("1884-07..1885-06, 1889-07..1890-06").

  # Lesson: when a branch fails, exhaust corpus rewordings before falling back
  # to an external lookup.
  - section: lessons
    targets: [replanner]
    content: |
      When replanning, only switch to external lookup if you are convinced the
      retrieval key was correct and the corpus genuinely does not carry the
      value. Prefer rewording the key (the corpus may file it under a fund or
      organizational-unit name), widening the year set (publication lag /
      fiscal-vs-calendar), or correcting the data period first.

  # Few-shots: data-window vs publication year, FY basis change, external CPI.
  - section: few_shots
    targets: [planner]
    content:
      - |
        ### Example (plain fiscal-year data range, pre-1977 July basis → period is the DATA window; same concept, two periods → ONE branch, comma-separated)
        Q: Absolute percent change in total ordinary receipts of the United States between fiscal year 1885 and fiscal year 1890, rounded to hundredths.
        Plan:
        ```json
        {
          "branches": [
            {"kind": "retrieve", "key": "total ordinary receipts",
             "period": "1884-07..1885-06, 1889-07..1890-06"}
          ]
        }
        ```

      - |
        ### Example (publication year is NOT the period — the volume printed in 1826 reports the YEAR 1825)
        Q: According to the receipts-and-expenditures volume published in 1826, what were the total expenditures of the United States for the year 1825?
        Plan:
        ```json
        {
          "branches": [
            {"kind": "retrieve", "key": "total expenditures of the United States",
             "period": "1825-01..1825-12"}
          ]
        }
        ```

      - |
        ### Example (fiscal years straddling the FY1977 July→October change — expand each FY on its own basis; the 1976 transition quarter is excluded from both)
        Q: Change in total budget outlays between fiscal year 1976 and fiscal year 1977.
        Plan:
        ```json
        {
          "branches": [
            {"kind": "retrieve", "key": "total budget outlays",
             "period": "1975-07..1976-06, 1976-10..1977-09"}
          ]
        }
        ```

      - |
        ### Example (a needed value looks external (CPI) — still emit a retrieve keyed by the question's wording; if the corpus lacks it, the lookup is injected at replan, never emitted here)
        Q: Real (CPI-adjusted, 2020 dollars) total expenditures of the United States in fiscal year 1953.
        Plan:
        ```json
        {
          "branches": [
            {"kind": "retrieve", "key": "total expenditures of the United States",
             "period": "1952-07..1953-06"},
            {"kind": "retrieve", "key": "CPI",
             "period": "1953-01..1953-12"}
          ]
        }
        ```

  # Few-shots: fresh-Plan replan — the replanner emits a fresh Plan holding ONLY
  # the branches to run NOW; branches already in the kept pool are not re-emitted.
  - section: few_shots
    targets: [replanner]
    content:
      - |
        ### Example (one branch failed — the concept is filed under an organizational unit; re-emit ONLY the reworded retrieve. The branch that already succeeded is in the kept pool — do not re-emit it)
        Values compute KEPT: total expenditures of the United States, FY1913.
        Previous plans:
          round 0:
            - {"kind": "retrieve", "key": "life-saving service expenditures", "period": "1912-07..1913-06"} → FAILED: no table named "life-saving service expenditures" — the FY1913 detailed statement files it under the Treasury organizational-unit breakdown ("LIFE-SAVING SERVICE", Salaries and expenses)
            - {"kind": "retrieve", "key": "total expenditures of the United States", "period": "1912-07..1913-06"} → ok
        Plan (only the branches to run NOW):
        ```json
        {
          "branches": [
            {"kind": "retrieve", "key": "Life-Saving Service, salaries and expenses",
             "period": "1912-07..1913-06"}
          ]
        }
        ```

      - |
        ### Example (a value is not in the corpus → re-emit it as a lookup_external; the retrieve that succeeded is in the kept pool, so emit ONLY the lookup)
        Values compute KEPT: total expenditures of the United States, FY1953.
        Previous plans:
          round 0:
            - {"kind": "retrieve", "key": "total expenditures of the United States", "period": "1952-07..1953-06"} → ok
            - {"kind": "retrieve", "key": "CPI", "period": "1953-01..1953-12"} → FAILED: the Combined Statement carries no consumer-price index
        What compute says is missing: cpi:1953. The question named no publisher, so leave `src` null.
        Plan (only the branches to run NOW):
        ```json
        {
          "branches": [
            {"kind": "lookup_external",
             "target": "U.S. CPI-U annual average for 1953 (base 2020=100)",
             "src": null}
          ]
        }
        ```


  # -------------------------------------------------------------------
  # EXTRACT (text + vision) — pull the requested figures off a page.
  # -------------------------------------------------------------------

  # What the extractor is looking at.
  - section: corpus
    targets: [extract.text, extract.vision]
    content: |
      The pages you receive are scanned images from the U.S. Combined Statement
      of Receipts and Expenditures (or the early govinfo receipts volumes).

  # How to read the era-specific space-separated cents notation.
  - section: corpus
    targets: [extract.text, extract.vision]
    content: |
      Money may print cents space-separated (chiefly 19th-century / early scanned
      volumes): "$8,008 50" means 8,008 dollars 50 cents. When a value is digits +
      a space + a final 1-2 digit group, read it as dollars.cents and emit the
      canonical number 8008.50 (strip "$" and thousands separators; ignore a
      trailing footnote ref like "2/"). Period-decimal values ("8,008.50") and
      whole values emit as-is. Always emit the number, not the spaced string.

  # Lesson: take unit/scale from the page, and the OCR pitfalls — "nan" cells,
  # account symbols that look numeric, digit errors, pre-decimal currency.
  - section: lessons
    targets: [extract.text, extract.vision]
    content: >
      Unit and scale come from the printed page — column header, caption,
      parenthetical legend, footnote ("(In thousands of dollars)"). Never guess
      from magnitude. Tables are OCR-derived: a cell rendered as the string
      "nan" is an EMPTY cell, not data; values may be exact dollars with cents;
      one cell can pack several tokens (two appropriation symbols
      "86X4070 86X4072") — appropriation / Treasury account symbols (agency code
      + availability code + account number; the middle "X" marks a no-year
      account, with a year or year-range sometimes there instead) are IDENTIFIER
      strings, not numeric values, so never read them as numbers; and figures
      can carry digit errors — when a value
      feeds a total or the question sums rows, cross-check it against the page's
      printed subtotal/total (in the oldest volumes the printed total and the
      summed line items can genuinely disagree — an original transcription
      error, not only OCR). In the earliest volumes (1790s–early 1800s) some
      figures may be in pre-decimal currency (pounds/shillings/pence) or carry
      mills (a third decimal = 1/1000 of a dollar); take the unit from the page
      and convert — never assume dollars-and-cents.

  # Lesson: match the requested series on EVERY qualifier; emit near-misses
  # explicitly rather than silently.
  - section: lessons
    targets: [extract.text, extract.vision]
    content: >
      Watch for qualifier-mismatched rows. These statements stack rows whose
      labels differ by a subtle modifier — "ordinary receipts" vs "total
      receipts", gross vs net, "held by the public" vs "held by Government
      accounts", general vs special vs trust fund, the warrants-issued vs the
      checks-issued basis, receipts by source (customs / internal revenue /
      public lands / postage) or by district / port / state, expenditures by
      department vs by object, total vs a subtotal, a maturing-schedule flow vs
      an outstanding stock. The lookup is satisfied only by a row matching the
      requested series including EVERY qualifier. Emit each variant as its own
      entry with the page's verbatim row text in `description`; if only a
      near-match is present, still emit it but make the difference explicit.
      Note a terminology drift: historical volumes are titled "Receipts and
      Disbursements" / "Account of the Receipts and Expenditures" and label
      outflows "disbursements"; govinfo volumes say "expenditures"; the modern
      (FY2001+) volumes are titled "Receipts, Outlays, and Balances" and say
      "outlays" — treat disbursements / expenditures / outlays as the same series
      but record the page's verbatim term.

  # Lesson: when a whole column/list is asked for, extract every row on the page
  # so a later step can assemble the full series.
  - section: lessons
    targets: [extract.text, extract.vision]
    content: >
      When the question needs a whole column or list — every state, every
      collection district, all accounts — extract the complete column on the page
      (every row), not only the rows that name entities in the question. A table
      continued from a previous page still lists its own rows; extract all of them
      so a downstream step can assemble the full series across pages.

  # Lesson (also search_agent): the early header-less ledger layout — read
  # positional columns and take labels from the block title / page banner.
  - section: lessons
    targets: [extract.text, extract.vision, search_agent]
    content: >
      Implicit headers in the early ledgers. The pre-1900 govinfo / historical
      volumes (the "Account of Receipts and Expenditures", kept warrant-by-warrant
      by the Treasury's Division of Bookkeeping and Warrants) print NO column-header
      row: a table opens straight into positional columns — date, warrant number,
      payee / description, amount (dollars and cents, the cents sometimes
      space-separated, e.g. "5,313 75"). Read these columns by position, not by a
      header. The account each row belongs to is named ABOVE the rows — the block
      title (e.g. "Awards under the First Article of the Treaty of Ghent") and the
      running page banner repeated at the top of every page of that account (e.g.
      "INTERCOURSE WITH FOREIGN NATIONS") — and a "Brought forward" line is the
      running subtotal carried from the previous page. A page (or scan block) whose
      column_headers are empty is this layout, not missing data or a failed parse;
      use the title / banner as the labels.

  # -------------------------------------------------------------------
  # COMPUTE — combine extracted/looked-up values into the final answer.
  # -------------------------------------------------------------------

  # Where the input_values came from and how their scale varies by era.
  - section: corpus
    targets: [compute.codegen]
    content: |
      The values in `input_values` were extracted from U.S. Combined Statement
      pages (or early govinfo volumes). Units are natural-language as printed,
      and scale varies by era — exact dollars in historical volumes, thousands
      or millions in modern summaries.

  # Lesson: flow vs stock, and reconcile scale/basis before combining values.
  - section: lessons
    targets: [compute.codegen]
    content: >
      Distinguish a flow (a year's receipts or expenditures) from a stock (an
      outstanding balance / the public debt as of a date), and watch the scale
      printed on the source page — historical volumes report exact dollars while
      modern ones often report thousands or millions. Confirm both entries are
      on the SAME basis before combining; never mix an exact-dollar figure with
      an "in thousands" figure without rescaling, and never compare a
      fiscal-year total against a calendar-year total.

  # Few-shots: closed-form scalar math, rescaling, and the missing-data signal.
  - section: few_shots
    targets: [compute.codegen]
    content:
      - |
        ### Example (closed-form, two scalars, same scale)
        Q: Absolute percent change in total ordinary receipts between FY1885 and FY1890.
        input_values: two scalars — [0] total ordinary receipts FY1885, [1] same FY1890, both unit "dollars".
        Why this shape: reference each entry by index, apply (B-A)/A·100, abs(), format. No unit conversion (same scale).
        Output:
        ```python
        a = input_values[0].frame.iat[0, 0]  # total ordinary receipts, FY1885
        b = input_values[1].frame.iat[0, 0]  # total ordinary receipts, FY1890
        result = f'{abs((b - a) / a * 100):.2f}'
        ```

      - |
        ### Example (scale mismatch — rescale before combining)
        Q: FY1968 administrative expenses as a percent of total expenditures.
        input_values: [0] scalar value=2267125.00 unit "dollars" (admin expenses), [1] scalar unit "thousands of dollars" (total expenditures).
        Why this shape: the entries are on different scales; bring both to dollars before dividing.
        Output:
        ```python
        admin = input_values[0].frame.iat[0, 0]            # dollars
        total = input_values[1].frame.iat[0, 0] * 1000     # thousands -> dollars
        result = f'{admin / total * 100:.2f}'
        ```

      - |
        ### Example (missing-data signal — form (b): keep what is still useful, then signal what is missing)
        Q: Real (CPI-adjusted, 2020 dollars) total expenditures for FY1953.
        input_values: only the nominal FY1953 scalar; no CPI series.
        Why this shape: required deflator is not in input_values. KEEP the nominal value so the next round can reuse it (drop-by-default — anything not kept is lost), then signal the missing CPI. Never fabricate.
        Output:
        ```python
        keep = {"nominal total expenditures FY1953 (dollars)": input_values[0]}
        missing = {"missing": ["cpi:1953", "cpi:2020"], "description": "no CPI series in input_values to convert nominal FY1953 to 2020 dollars"}
        ```
