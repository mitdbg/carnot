[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skunk"
version = "0.1.0"
description = "Library for agentic retrieval and computation over document corpora"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4",
    "chromadb>=1.4.0",
    "google-genai",
    "httpx",
    "jinja2",
    "openrouter",
    "pandas",
    "pydantic>=2",
    "pymupdf",
    "pyyaml",
    "numpy",
    "statsmodels",
    "tavily-python",
]

[project.optional-dependencies]
# Local SentenceTransformers embedding backend (LLMClient emb_provider="local");
# heavy (pulls in torch), so opt-in. API-backed embeddings need nothing extra.
embeddings = ["sentence-transformers"]
rollout = ["tinker", "tinker_cookbook"]
dev = ["pandas-stubs==3.0.3.260530"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
skunk = ["py.typed"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# StepFailed is a deliberate name (read as a tagged failure mode, not a fatal
# error); we intentionally don't follow PEP 8's "Error" suffix convention here.
extend-ignore = ["N818"]
