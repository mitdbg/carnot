[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skunk"
version = "0.1.0"
description = "Declarative QA pipeline over the U.S. Treasury Bulletin corpus"
requires-python = ">=3.10"
dependencies = [
    "chromadb>=1.4.0",
    "google-genai",
    "jinja2",
    "pandas",
    "pyarrow",
    "pydantic>=2",
    "pymupdf",
    "pyyaml",
    "numpy",
    "statsmodels",
    "tavily-python",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
skunk = ["py.typed"]

[tool.ruff.lint]
# StepFailed is a deliberate name (read as a tagged failure mode, not a fatal
# error); we intentionally don't follow PEP 8's "Error" suffix convention here.
extend-ignore = ["N818"]
