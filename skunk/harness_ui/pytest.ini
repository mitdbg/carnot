[pytest]
asyncio_mode = strict
# Third-party deprecation noise from uvicorn calling deprecated APIs in
# the websockets library. Not actionable from this kit.
filterwarnings =
    ignore::DeprecationWarning:websockets.legacy
    ignore::DeprecationWarning:websockets.legacy.server
    ignore::DeprecationWarning:uvicorn.protocols.websockets.websockets_impl
    ignore:websockets.legacy is deprecated:DeprecationWarning
    ignore:websockets.server.WebSocketServerProtocol is deprecated:DeprecationWarning
    ignore:remove second argument of ws_handler:DeprecationWarning
