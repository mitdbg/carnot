<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Skunk Agent Console</title>
  <link rel="stylesheet" href="/static/client.css">
  <script defer src="/static/trace_flow.js"></script>
  <script defer src="/static/client.js"></script>
</head>
<body>
<header>
  <div class="topbar">
    <h1>Skunk Agent Console</h1>
    <div class="meta">
      <span class="pill">Connection <strong id="connection">-</strong></span>
      <span class="pill">Round <strong id="roundNum">-</strong></span>
      <span class="pill">Round Status <strong id="roundStatus">-</strong></span>
      <span class="pill">Resubmits <strong id="resubmitsLeft">-</strong></span>
    </div>
  </div>
</header>
<main>
  <section class="summary">
    <div id="roundTimerMetric" class="metric timer"><span>Time Remaining</span><strong id="roundTimer">--:--</strong></div>
    <div class="metric"><span>Total</span><strong id="mTotal">0</strong></div>
    <div class="metric"><span>Running</span><strong id="mRunning">0</strong></div>
    <div class="metric"><span>Ready</span><strong id="mReady">0</strong></div>
    <div class="metric"><span>Submitted</span><strong id="mSubmitted">0</strong></div>
    <div class="metric"><span>Failed</span><strong id="mFailed">0</strong></div>
    <div class="metric"><span>Cancelled</span><strong id="mCancelled">0</strong></div>
  </section>
  <div id="app">Connecting...</div>
</main>
</body>
</html>
